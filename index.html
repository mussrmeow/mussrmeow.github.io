<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя книга</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #f9f6f0;
            color: #333;
            text-align: center;
            padding: 50px 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            font-size: 3em;
            color: #2c3e50;
            margin-bottom: 0.2em;
        }
        .author {
            font-size: 1.5em;
            color: #7f8c8d;
            font-style: italic;
            margin-bottom: 2em;
        }
        .cover {
            width: 300px;
            height: 400px;
            background-color: #bdc3c7;
            margin: 0 auto 2em;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            border-radius: 5px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .description {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 2em;
            text-align: left;
        }
        .button {
            display: inline-block;
            padding: 15px 30px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.1em;
        }
        .button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <h1>Название вашей книги</h1>
    <p class="author">Автор: Ваше Имя</p>

    <!-- Это заглушка для обложки. Позже вы сможете заменить её на картинку -->
    <div class="cover">Обложка книги</div>

    <div class="description">
        <p>Здесь будет краткое описание вашей книги. Расскажите читателям, о чём она, почему её стоит прочитать, и что их ждёт внутри.</p>
    </div>

    <!-- Замените # на ссылку, где можно купить или скачать книгу -->
    <a href="#" class="button">Купить книгу</a>
</body>
</html>
